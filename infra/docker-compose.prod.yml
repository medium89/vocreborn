x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../apps/api
    ports:
      - 127.0.0.1:3004:3001
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_PORT: "3001"
      WEB_ORIGIN: https://${DOMAIN}
      PUBLIC_API_URL: https://${DOMAIN}
      METRICS_TOKEN: ${METRICS_TOKEN}
      NODE_ENV: production
      TUSOVA_BOTS_ENABLED: "false"
      TUSOVA_QUIZ_ENABLED: ${TUSOVA_QUIZ_ENABLED:-false}
      TUSOVA_RADIO_ENABLED: ${TUSOVA_RADIO_ENABLED:-false}
      RADIO_WORKER_URL: ${RADIO_WORKER_URL:-http://radio-worker:8090}
      RADIO_WORKER_TOKEN: ${RADIO_WORKER_TOKEN:-}
      RADIO_STORAGE_DIR: /app/storage/radio
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@tusova.su}
    volumes:
      - avatar-data:/app/uploads
      - attachment-data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ..
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_GIPHY_API_KEY: ${NEXT_PUBLIC_GIPHY_API_KEY:-}
        GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
        YANDEX_SITE_VERIFICATION: ${YANDEX_SITE_VERIFICATION:-}
    ports:
      - 127.0.0.1:3003:3000
    restart: unless-stopped
    stop_grace_period: 20s
    logging: *default-logging
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres-data:
  attachment-data:
  avatar-data:
  caddy-data:
  caddy-config:
