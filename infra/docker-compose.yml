services:
  postgres:
    image: postgres:17-alpine
    container_name: vocreborn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vocreborn
      POSTGRES_USER: vocreborn
      POSTGRES_PASSWORD: vocreborn_dev
    ports:
      - "5432:5432"
    volumes:
      - vocreborn-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocreborn -d vocreborn"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: vocreborn-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"


volumes:
  vocreborn-postgres-data:
